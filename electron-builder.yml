appId: com.crmeasy.app
productName: CRM-Easy
copyright: Copyright © 2026 CRM-Easy

directories:
  buildResources: build
  output: release

files:
  - out/**
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'

extraResources:
  - from: drizzle
    to: drizzle

linux:
  # Architectures: x64 and arm64 (both built from any host via cross-compile).
  # Priority: .deb and .rpm first; AppImage as portable fallback.
  # pacman available via: npx electron-builder --linux pacman (needs bsdtar).
  target:
    - deb
    - rpm
    - AppImage
  artifactName: crm-easy-${version}-${arch}.${ext}
  category: Office
  maintainer: CRM-Easy
  synopsis: Offline-first desktop CRM for individuals
  desktop:
    entry:
      Name: CRM-Easy

win:
  # Architectures: x64 and arm64 (Windows on ARM).
  # Priority: NSIS .exe installer. (MSI available via: npx electron-builder --win msi)
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

msi:
  artifactName: ${productName}-${version}-${arch}.${ext}
