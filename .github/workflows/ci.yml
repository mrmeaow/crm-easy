name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux (lint · typecheck · test · package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native modules for Electron
        run: npm run postinstall
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx electron-vite build
      - name: Install packaging tools (bsdtar for pacman target)
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Package (deb, rpm, AppImage, pacman · x64 + arm64)
        run: npx electron-builder --linux deb rpm AppImage pacman --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: crm-easy-linux-packages
          path: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.pacman
          if-no-files-found: error

  windows:
    name: Windows (typecheck · test · package)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native modules for Electron
        run: npm run postinstall
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx electron-vite build
      - name: Package (NSIS .exe · x64 + arm64)
        run: npx electron-builder --win nsis --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: crm-easy-windows-installer
          path: release/CRM-Easy-Setup-*.exe
          if-no-files-found: error
