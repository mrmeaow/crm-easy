name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native modules for Electron
        run: npm run postinstall
      - name: Install packaging tools (bsdtar for pacman target)
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Build
        run: npx electron-vite build
      - name: Package
        run: npx electron-builder --linux deb rpm AppImage pacman --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.pacman

  windows:
    name: Build Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native modules for Electron
        run: npm run postinstall
      - name: Build
        run: npx electron-vite build
      - name: Package
        run: npx electron-builder --win nsis --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload unsigned installers (for SignPath)
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installers
          path: release/CRM-Easy-Setup-*.exe
      - name: Sign installers (SignPath Foundation) - placeholder
        id: signpath
        if: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: echo "SignPath skipped change"
      - name: Upload signed installers
        uses: softprops/action-gh-release@v2
        with:
          files: signed/*.exe
      - name: Upload installers (unsigned fallback)
        uses: softprops/action-gh-release@v2
        with:
          files: release/CRM-Easy-Setup-*.exe
